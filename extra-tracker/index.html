<!doctype html>
<html lang="it">
  <head>
    <!-- ANTI-FOUC: Apply theme BEFORE any rendering to prevent dark/light flash -->
    <script>
      (function() {
        var theme = null;
        try { theme = localStorage.getItem('et-theme'); } catch(e) {}
        if (theme !== 'dark' && theme !== 'light') { theme = 'dark'; }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Silvi - Gestisci le tue ore di lavoro con stile" />
    <meta name="theme-color" content="#6366f1" />
    <title>Silvi AI</title>
    <!-- OTTIMIZZATO: Resource hints per performance - fonts.gstatic.com è critico per LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    <!-- OTTIMIZZATO: Preload font per evitare FOIT (Flash of Invisible Text) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
    <!-- OTTIMIZZATO: Inline critical CSS per First Contentful Paint (theme-aware via data-theme) -->
    <style>
      /* Critical CSS - Above the fold */
      body{margin:0;font-family:Inter,sans-serif;background:#0a0a1a;color:#fff}
      [data-theme="light"] body{background:#f2f6fc;color:#1a1a2e}
      #root{min-height:100vh}
      .antialiased{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <div id="datepicker-portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
