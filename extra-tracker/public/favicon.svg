<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Default (Light Mode): Colori leggermente più scuri per contrasto su tab chiare */
    .amber-part { fill: #D97706; } /* amber-600 */
    .violet-part { fill: #7C3AED; } /* violet-600 */

    /* Dark Mode: Colori più luminosi/pastello per "accendersi" su tab scure */
    @media (prefers-color-scheme: dark) {
      .amber-part { fill: #FBBF24; } /* amber-400 */
      .violet-part { fill: #A78BFA; } /* violet-400 */
    }
  </style>

  <path class="amber-part" d="M50 0 C55 25 70 35 100 45 C70 55 60 60 50 50 C45 40 60 25 50 0 Z" />

  <path class="violet-part" d="M50 100 C45 75 30 65 0 55 C30 45 40 40 50 50 C55 60 40 75 50 100 Z" />
</svg>