services:
  # 1. IL DATABASE
  mongodb:
    image: mongo:latest
    container_name: extra-tracker-db
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo-data:/data/db # Persistenza: salva i dati anche se spegni docker

  # 2. REDIS (Rate Limiting, Token Blacklist, Activity Queue)
  redis:
    image: redis:latest
    container_name: extra-tracker-redis
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepass password123
    volumes:
      - redis-data:/data # Persistenza: salva i dati anche se spegni docker

volumes:
  mongo-data:
  redis-data: