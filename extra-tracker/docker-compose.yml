version: '3.8'

services:
# 1. IL DATABASE
  mongodb:
    image: mongo:latest
    container_name: extra-tracker-db
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo-data:/data/db # Persistenza: salva i dati anche se spegni docker
      # 2. L'INTERFACCIA GRAFICA (Opzionale ma utilissima per imparare)
  mongo-express:
    image: mongo-express
    container_name: extra-tracker-ui
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo-data: